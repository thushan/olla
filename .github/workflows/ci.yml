name: CI

on:
  push:
    branches:
      - main
      - 'pipelines/*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - '**/*.txt'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - '**/*.txt'

env:
  GO_VERSION: 1.24.x
  BUN_VERSION: "1.3.5"
  GOLANGCILINT_VERSION: "2.11.4"
  BETTERALIGN_VERSION: "0.8.2"

permissions:
  contents: read
  pull-requests: read

# Deliberately NOT run here (user decision, not an oversight): the
# claude-code-e2e / /olla-validate agent skills, test/scripts/* shell
# scenarios, and `make test-stress`. These need real backends, take
# multi-minute-to-multi-hour runs, or both - they're agent/human-gated
# pre-release and post-major-change gates, not per-push/PR CI checks.
# See docs/content/development/validation.md.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24']
    steps:
      - name: Configure Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify dependencies
        run: go mod verify

      - name: Download dependencies
        run: go mod download

      - name: Configure Bun
        # make build now rebuilds the dashboard SPA, which needs Bun.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run go vet
        run: make vet

      - name: Run go fmt check
        run: make fmt && git diff --exit-code

      - name: Run frontend gates (vitest + svelte-check + font integrity)
        run: make ci-web

      - name: Build
        run: make build

      - name: Run full test suite (incl. testing.Short()-gated tests)
        # test-race-cover below runs with -short, which skips slower cases
        # (stress tests, slow-shutdown scenarios) - this plain `test` pass is
        # the only gate that actually executes them.
        run: make test

      - name: Run tests with race detection and coverage
        # test-race-cover is test-race's exact selection (-race -short) plus a
        # coverage profile - the Makefile is the single source of truth for
        # what "the tests" means here.
        run: make test-race-cover

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: golangci-lint
        # Kept on the dedicated action (not `make lint`) deliberately: the
        # Makefile's lint target runs golangci-lint with --fix for local
        # convenience, which would silently patch files in CI instead of
        # failing the build. The action also gives caching and inline PR
        # annotations `make lint` doesn't.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v${{ env.GOLANGCILINT_VERSION }}
          args: --timeout=10m --max-same-issues=0 --max-issues-per-linter=0
          # skip the online config-schema check against golangci-lint.run - it's
          # network-dependent, redundant with `make ready` validating the config
          # locally against the real linter, and was timing out CI runners
          verify: false

      - name: betteralign checks
        run: |
          go install github.com/dkorunic/betteralign/cmd/betteralign@v${{ env.BETTERALIGN_VERSION }}
          make align-check

  cross-platform:
    name: Cross-Platform Build Validation
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU for ARM64 emulation (Linux only)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm64

      - name: Configure Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure Bun
        # make build-release rebuilds the dashboard SPA, which needs Bun.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build and test native platform
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            make validate-linux
          elif [ "${{ runner.os }}" = "macOS" ]; then
            make validate-darwin
          elif [ "${{ runner.os }}" = "Windows" ]; then
            make validate-windows
          fi
        shell: bash

      - name: Verify release build
        run: |
          make build-release
          echo "Testing built binary..."
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./bin/olla.exe --version
          else
            ./bin/olla --version
          fi
        shell: bash
