# Local verification of a release snapshot. Run on a host that has Go,
# Bun and make installed (the before.hooks run `make build-web`),
# then from the repo root:
#   $ goreleaser release --snapshot --clean
# The bare goreleaser/goreleaser container image lacks Go, Bun and make,
# so it cannot satisfy the hooks. Tagged releases are cut by the
# GitHub Actions workflow at .github/workflows/release.yml, which pins
# setup-bun before invoking goreleaser.

version: 2

project_name: olla

before:
  hooks:
    - go mod download
    # Build the dashboard SPA into the gitignored embed source before the Go
    # build compiles it in. Release binaries must always ship the current SPA.
    - make build-web
    # Create empty directories for the package
    - mkdir -p logs tmp data build
    - touch data/.gitkeep
    - touch logs/.gitkeep
    - touch tmp/.gitkeep
    - bash ./scripts/generate-container-config.sh
    # Stage the docker-flavoured config under build/ (gitignored, ephemeral) -
    # it used to overwrite the tracked root config.yaml here, which is now the
    # canonical default and must not be clobbered by a release build. The
    # Dockerfile lands it at /app/config/config.yaml, the first path the config
    # loader searches.
    - cp config/docker.yaml build/docker-config.yaml

release:
  name_template: "Olla {{ .Tag }}"
  draft: false
  prerelease: auto
  make_latest: true
  header: |
    ## What's in this release

    Olla is a high-performance proxy and load balancer for LLM infrastructure.

    ### Quick Start
    ```bash
    # Docker
    docker pull ghcr.io/thushan/olla:{{ .Tag }}

    # Binary (see assets below)
    ./olla --config config.yaml
    ```
  footer: |
    ---
    **Documentation:** [thushan.github.io/olla](https://thushan.github.io/olla/) | **Issues:** [github.com/thushan/olla/issues](https://github.com/thushan/olla/issues)

snapshot:
  version_template: '{{ incpatch .Version }}-{{.ShortCommit}}'

builds:
  - id: default
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
    goamd64:
      # https://github.com/golang/go/wiki/MinimumRequirements#amd64
      - v1
    goos:
      - darwin
      - freebsd
      - linux
      - windows
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X "github.com/thushan/olla/internal/version.Version=v{{.Version}}"
      - -X "github.com/thushan/olla/internal/version.Commit={{.Commit}}"
      - -X "github.com/thushan/olla/internal/version.Date={{.CommitDate}}"
      - -X "github.com/thushan/olla/internal/version.User=goreleaser"
#    asmflags:
#      - all=-trimpath={{ dir (default "." .Env.PWD) }}
#    gcflags:
#      - all=-trimpath={{ dir (default "." .Env.PWD) }}


# dockers_v2 builds every platform of an entry in one buildx run and pushes the
# resulting multi-arch index under all of the entry's tags, so there is no
# separate manifest step. The first entry therefore publishes the four tag
# families as multi-arch manifests. The second and third publish the same
# families as single-arch -amd64 and -arm64 tags, which are published today and
# which users pin to. They build from Dockerfile.goreleaser, which copies the
# binary from $TARGETPLATFORM/ (the root Dockerfile is for make
# docker-build-local only).
#
# dockers_v2 has no skip_push: auto. The tags are unconditional, so without the
# disable templates an RC tag would republish :latest, :v0 and :v0.0 to every
# user. A prerelease is skipped entirely; a snapshot still builds (and loads
# locally, which is what release-dryrun.yml boots). In a snapshot goreleaser
# builds the first entry per platform and appends -amd64/-arm64 itself, so the
# explicit single-arch entries are disabled there rather than double-suffixed.
#
# sbom and buildx provenance are off to keep what is published identical to the
# legacy pipeline: the defaults attach attestation manifests (unknown/unknown
# platforms) to every index and turn the single-arch tags into indexes too.
dockers_v2:
  - id: olla-multiarch
    dockerfile: Dockerfile.goreleaser
    images:
      - "ghcr.io/thushan/olla"
    tags:
      - "latest"
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    disable: "{{ if and .Prerelease (not .IsSnapshot) }}true{{ end }}"
    sbom: false
    flags:
      - "--pull"
      - "--provenance=false"
    labels: &olla-labels
      org.opencontainers.image.created: "{{.Date}}"
      org.opencontainers.image.title: "{{.ProjectName}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.source: "{{.GitURL}}"
      org.opencontainers.image.description: "High-performance LLM front-end load balancer and proxy"
      org.opencontainers.image.licenses: "Apache-2.0"
    extra_files: &olla-extra-files
      # Exactly what Dockerfile.goreleaser COPYs, alongside the binaries
      # goreleaser adds. Docker-flavoured config is staged under build/ by the
      # before-hook above rather than overwriting the tracked root config.yaml.
      - build/docker-config.yaml
      - config/models.yaml
      - config/profiles/
  - id: olla-amd64
    dockerfile: Dockerfile.goreleaser
    images:
      - "ghcr.io/thushan/olla"
    tags:
      - "latest-amd64"
      - "{{ .Tag }}-amd64"
      - "v{{ .Major }}-amd64"
      - "v{{ .Major }}.{{ .Minor }}-amd64"
    platforms:
      - linux/amd64
    disable: "{{ if or .IsSnapshot .Prerelease }}true{{ end }}"
    sbom: false
    flags:
      - "--pull"
      - "--provenance=false"
    labels: *olla-labels
    extra_files: *olla-extra-files
  - id: olla-arm64
    dockerfile: Dockerfile.goreleaser
    images:
      - "ghcr.io/thushan/olla"
    tags:
      - "latest-arm64"
      - "{{ .Tag }}-arm64"
      - "v{{ .Major }}-arm64"
      - "v{{ .Major }}.{{ .Minor }}-arm64"
    platforms:
      - linux/arm64
    disable: "{{ if or .IsSnapshot .Prerelease }}true{{ end }}"
    sbom: false
    flags:
      - "--pull"
      - "--provenance=false"
    labels: *olla-labels
    extra_files: *olla-extra-files

checksum:
  name_template: "checksums.txt"

archives:
  - files:
      - LICENSE
      - readme.md
      # Explicitly include only the config files we want to ship
      - src: config/config.yaml
        dst: config/config.yaml
      - src: config/models.yaml
        dst: config/models.yaml
      - src: config/docker.yaml
        dst: config/docker.yaml
      - src: config/profiles/*.yaml
        dst: config/profiles/
      # include examples
      - src: examples/ollama-openwebui/compose.yaml
        dst: examples/ollama-openwebui/compose.yaml
      - src: examples/ollama-openwebui/README.md
        dst: examples/ollama-openwebui/README.md
      - src: examples/ollama-openwebui/olla.yaml
        dst: examples/ollama-openwebui/olla.yaml
      # Explicitly exclude any local config files
      - "!config/*.local.yaml"
      - "!config/**/*.local.yaml"
      # Include empty directories
      - data/.gitkeep
      - logs/.gitkeep
      - tmp/.gitkeep
    format_overrides:
      - goos: windows
        formats: [zip]
      - goos: darwin
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_v{{- .Version }}_{{- if eq .Os "darwin" }}macos_{{- else }}{{ .Os }}_{{ end }}{{- .Arch }}

changelog:
  sort: asc
  use: github
  groups:
    - title: "Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "Performance"
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: "CI/CD"
      regexp: '^.*?ci(\(.+\))??!?:.+$'
      order: 3
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^Merge"
      - "^docs:"
      - "^test:"
      - "^style:"
      - "^chore:"