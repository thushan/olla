version: "2"

run:
  go: "1.27"
  concurrency: 8

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocognit
    - goconst
    - gocritic
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - intrange
    - makezero
    - misspell
    - modernize
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    # - tagliatelle
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign

  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        - G104  # unhandled errors — acceptable in fire-and-forget cleanup paths
        - G115  # integer overflow conversions — false positives on small bounded values
        - G118  # context.Background in goroutines — intentional for long-lived background workers
        - G301  # directory permissions 0755 — standard for log directories
        - G304  # file inclusion via variable — expected for config/profile loaders
        - G703  # path traversal via taint — expected for config/profile loaders
        - G704  # SSRF via taint — expected for a proxy that forwards requests by design
    govet:
      enable:
        - shadow
    gocognit:
      min-complexity: 30
    goconst:
      # Short, repeated literals are mostly map keys and field names, where a
      # constant adds indirection without removing a magic string.
      min-len: 4
      min-occurrences: 5
      ignore-map-keys: true
    misspell:
      ignore-rules:
        - thushan
    perfsprint:
      strconcat: false
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1008  # explicit embedded selectors are deliberate in the registry/proxy wrappers
        # The context key constants are plain strings on purpose: the same constants
        # are slog keys, InspectionMeta keys and util.StripRoutePrefix lookups, so
        # typing them breaks those. Typing the context keys is its own change.
        - -SA1029
    testifylint:
      enable-all: true
    usetesting:
      # context-background and context-todo default to false and are turned on
      # here; os-setenv is on by default.
      context-background: true
      context-todo: true
    modernize:
      disable:
        # omitzero: swapping omitempty for omitzero changes which nested
        # struct fields reach the JSON wire format; a wire-format change
        # needs its own deliberate decision.
        - omitzero
        # stringsbuilder: one site in the codebase; deliberately left alone
        # because the churn is not worth it.
        - stringsbuilder
        # slicesdelete, appendclipped and bloop are not analyzers in
        # golangci-lint v2.15.0's modernize set, so they are not listed here.

  exclusions:
    generated: strict
    paths:
      - doc
    rules:
      - path: '(.+)(_test\.go|_test_helpers\.go)'
        linters:
          - gocognit
          - gosec
          - forcetypeassert
          - goconst
          - gocritic
          - govet
          - nilerr
          - noctx
          - perfsprint
          - predeclared
          - prealloc
          - staticcheck
          - testifylint
          - unconvert
          - unparam
          - wastedassign
      - path: internal/util/request.go
        linters:
          - gosec
        text: "G404"

formatters:
  enable:
    - goimports

  exclusions:
    generated: strict
    paths:
      - doc
